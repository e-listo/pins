<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transaksi - PINS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#1a56db">
</head>
<body>
  <div class="pins-main">
    <div class="topbar">
      <h2>PINS DPUPKP</h2>
      <div class="topbar-actions">
        <div class="user-meta">
          <strong id="user-name">-</strong>
          <span id="user-role">-</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="logout-btn">Keluar</button>
      </div>
    </div>
    <nav class="nav-tabs">
      <a href="dashboard.html">Dashboard</a>
      <a href="barang.html">Barang</a>
      <a href="transaksi.html" class="active">Transaksi</a>
      <a href="scan.html">Scan QR</a>
    </nav>

    <div class="content">
      <div class="toolbar-v2">
        <div class="toolbar-actions">
          <select id="filter-tipe" style="padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.85rem;">
            <option value="">Semua Tipe</option>
            <option value="masuk">Masuk</option>
            <option value="keluar">Keluar</option>
            <option value="mutasi">Mutasi</option>
          </select>
          <button class="btn btn-primary btn-sm" data-role="superadmin,Admin Gudang,Pengurus Barang Pembantu" id="btn-tambah">+ Input Transaksi</button>
          <span class="jumlah-info" id="jumlah-transaksi"></span>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>No. Transaksi</th><th>Tanggal</th><th>Tipe</th><th>Jumlah</th><th>Sisa Stok</th></tr>
            </thead>
            <tbody id="tabel-transaksi">
              <tr><td colspan="5" class="loading-row">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-list" id="card-transaksi"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-transaksi">
    <div class="modal">
      <h3>Input Transaksi Baru</h3>
      <form id="form-transaksi">
        <div class="form-row">
          <div class="form-group">
            <label>Tipe Transaksi</label>
            <select id="f-tipe" required>
              <option value="masuk">Masuk (barang datang)</option>
              <option value="keluar">Keluar (barang dipakai)</option>
              <option value="mutasi">Mutasi (pindah gudang)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Jumlah</label>
            <input type="number" id="f-jumlah" min="1" required>
          </div>
        </div>

        <div class="form-group">
          <label>Barang</label>
          <select id="f-barang_id" required></select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Harga Satuan (Rp)</label>
            <input type="number" id="f-harga_satuan" min="0" value="0">
          </div>
          <div class="form-group">
            <label>No. SPK / Referensi</label>
            <input type="text" id="f-no_spk">
          </div>
        </div>

        <div class="form-group">
          <label>Keterangan</label>
          <textarea id="f-keterangan" rows="2"></textarea>
        </div>

        <div class="error-msg" id="form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-batal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    requireLogin();
    renderHeaderUser();
    terapkanBatasanRole();
    document.getElementById("logout-btn").addEventListener("click", logout);

    const labelTipe = { masuk: "Masuk", keluar: "Keluar", mutasi: "Mutasi" };
    const badgeTipe = { masuk: "badge-hijau", keluar: "badge-merah", mutasi: "badge-kuning" };

    async function muatTransaksi() {
      const tipe = document.getElementById("filter-tipe").value;
      const qs = tipe ? `?tipe=${tipe}` : "";
      try {
        const items = await apiFetch(`/transaksi${qs}`);
        document.getElementById("jumlah-transaksi").textContent = `${items.length} transaksi`;

        const tbody = document.getElementById("tabel-transaksi");
        const cardList = document.getElementById("card-transaksi");

        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="loading-row">Belum ada transaksi.</td></tr>';
          cardList.innerHTML = '<div class="loading-row">Belum ada transaksi.</div>';
          return;
        }

        tbody.innerHTML = items.map(t => `
          <tr>
            <td><code style="color:#1a56db;font-size:.78rem;">${t.nomor_transaksi}</code></td>
            <td>${t.tanggal}</td>
            <td><span class="badge ${badgeTipe[t.tipe] || 'badge-biru'}">${labelTipe[t.tipe] || t.tipe}</span></td>
            <td>${t.jumlah}</td>
            <td>${t.sisa_stok}</td>
          </tr>
        `).join("");

        cardList.innerHTML = items.map(t => `
          <div class="item-card">
            <div class="item-card-top">
              <span class="item-card-kode">${t.nomor_transaksi}</span>
              <span class="badge ${badgeTipe[t.tipe] || 'badge-biru'}">${labelTipe[t.tipe] || t.tipe}</span>
            </div>
            <div class="item-card-meta">
              <span>${t.tanggal}</span>
              <span>Jml: ${t.jumlah} &middot; Sisa: ${t.sisa_stok}</span>
            </div>
          </div>
        `).join("");
      } catch (err) {
        pinsToast("Gagal memuat transaksi: " + err.message, "error");
      }
    }
    muatTransaksi();
    document.getElementById("filter-tipe").addEventListener("change", muatTransaksi);

    const modal = document.getElementById("modal-transaksi");
    function tutupModal() { modal.classList.remove("show"); document.getElementById("form-error").textContent = ""; }

    async function isiPilihanBarang() {
      const select = document.getElementById("f-barang_id");
      try {
        const items = await apiFetch("/barang");
        select.innerHTML = items.map(b =>
          `<option value="${b.id}">${b.nama} (stok: ${b.stok} ${b.satuan})</option>`
        ).join("");
      } catch (err) {
        select.innerHTML = '<option value="">Gagal memuat barang</option>';
      }
    }

    document.getElementById("btn-tambah").addEventListener("click", async () => {
      document.getElementById("form-transaksi").reset();
      await isiPilihanBarang();
      modal.classList.add("show");
    });
    document.getElementById("btn-batal").addEventListener("click", tutupModal);

    document.getElementById("form-transaksi").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        tipe: document.getElementById("f-tipe").value,
        barang_id: document.getElementById("f-barang_id").value,
        jumlah: parseInt(document.getElementById("f-jumlah").value),
        harga_satuan: parseInt(document.getElementById("f-harga_satuan").value) || 0,
        no_spk: document.getElementById("f-no_spk").value.trim(),
        keterangan: document.getElementById("f-keterangan").value.trim(),
      };
      try {
        await apiFetch("/transaksi", { method: "POST", body: JSON.stringify(payload) });
        pinsToast("Transaksi berhasil disimpan", "success");
        tutupModal();
        muatTransaksi();
      } catch (err) {
        document.getElementById("form-error").textContent = err.message;
      }
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
