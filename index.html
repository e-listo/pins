<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Login - PINS DPUPKP</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#1e6091">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>PINS</h1>
      <p class="subtitle">PUPKP Inventory System &mdash; DPUPKP Kota Yogyakarta</p>

      <form id="login-form">
        <label for="nip">NIP / Email</label>
        <input type="text" id="nip" name="nip" required autocomplete="username" placeholder="Contoh: 198306172010011015">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <div class="error-msg" id="login-error"></div>

        <button type="submit" class="btn-primary" id="login-btn">Masuk</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (getToken()) {
        window.location.href = "dashboard.html";
        return;
      }

      const form = document.getElementById("login-form");
      const errEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.textContent = "";
        btn.disabled = true;
        btn.textContent = "Memproses...";

        const nip = document.getElementById("nip").value.trim();
        const password = document.getElementById("password").value;

        try {
          const data = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ nip, password }),
          });
          setToken(data.token);
          setUser(data.pegawai);
          window.location.href = "dashboard.html";
        } catch (err) {
          errEl.textContent = err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = "Masuk";
        }
      });
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
