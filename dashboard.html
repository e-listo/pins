<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard - PINS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#1e6091">
</head>
<body>
  <header class="app-header">
    <div class="title">PINS DPUPKP</div>
    <div class="user-info">
      <div id="user-name">-</div>
      <div class="role" id="user-role">-</div>
    </div>
  </header>
  <nav class="nav-tabs">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="barang.html">Barang</a>
    <a href="transaksi.html">Transaksi</a>
    <a href="scan.html">Scan QR</a>
    <a href="#" id="logout-link">Keluar</a>
  </nav>

  <div class="container">
    <div class="grid-2">
      <div class="card stat-box">
        <div class="num" id="total-barang">-</div>
        <div class="label">Jenis Barang</div>
      </div>
      <div class="card stat-box alert">
        <div class="num" id="total-stok-rendah">-</div>
        <div class="label">Stok di Bawah Minimum</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Barang dengan Stok Rendah</h3>
      <table>
        <thead>
          <tr><th>Kode</th><th>Nama</th><th>Stok</th><th>Minimum</th></tr>
        </thead>
        <tbody id="tabel-stok-rendah">
          <tr><td colspan="4" class="text-muted">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" data-role="superadmin,Verifikator,Verifikator Utama">
      <h3 style="margin-top:0;">Laporan Resmi</h3>
      <p class="text-muted">Untuk keperluan rekonsiliasi SIMBARA / bahan pemeriksaan.</p>
      <button class="btn-secondary btn-sm" id="btn-laporan-stok">Unduh Laporan Stok Resmi</button>
      <button class="btn-secondary btn-sm" id="btn-laporan-transaksi">Unduh Laporan Transaksi Resmi</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireLogin();
    renderHeaderUser();
    terapkanBatasanRole();

    document.getElementById("logout-link").addEventListener("click", (e) => {
      e.preventDefault();
      logout();
    });

    async function muatDashboard() {
      try {
        const barang = await apiFetch("/barang");
        const stokRendah = await apiFetch("/barang/stok-rendah");

        document.getElementById("total-barang").textContent = barang.length;
        document.getElementById("total-stok-rendah").textContent = stokRendah.length;

        const tbody = document.getElementById("tabel-stok-rendah");
        if (stokRendah.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-muted">Tidak ada barang dengan stok rendah.</td></tr>';
        } else {
          tbody.innerHTML = stokRendah.map(b => `
            <tr>
              <td>${b.kode_aset}</td>
              <td>${b.nama}</td>
              <td><span class="badge badge-danger">${b.stok}</span></td>
              <td>${b.stok_minimum}</td>
            </tr>
          `).join("");
        }
      } catch (err) {
        alert("Gagal memuat dashboard: " + err.message);
      }
    }
    muatDashboard();

    document.getElementById("btn-laporan-stok").addEventListener("click", () => {
      downloadFile("/reports/resmi/stok", "laporan_resmi_stok.xlsx");
    });
    document.getElementById("btn-laporan-transaksi").addEventListener("click", () => {
      downloadFile("/reports/resmi/transaksi", "laporan_resmi_transaksi.xlsx");
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
