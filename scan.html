<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Scan QR - PINS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#1a56db">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="pins-main">
    <div class="topbar">
      <h2>PINS DPUPKP</h2>
      <div class="topbar-actions">
        <div class="user-meta">
          <strong id="user-name">-</strong>
          <span id="user-role">-</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="logout-btn">Keluar</button>
      </div>
    </div>
    <nav class="nav-tabs">
      <a href="dashboard.html">Dashboard</a>
      <a href="barang.html">Barang</a>
      <a href="transaksi.html">Transaksi</a>
      <a href="scan.html" class="active">Scan QR</a>
    </nav>

    <div class="content">
      <div class="card card-pad">
        <h3 style="margin:0 0 4px;font-size:.9rem;">Scan QR Code Aset</h3>
        <p class="text-muted" style="margin:0 0 14px;">Arahkan kamera ke label QR pada barang untuk lihat info stok secara instan.</p>
        <div id="qr-reader"></div>
        <button class="btn btn-secondary btn-block mt-16" id="btn-manual">Atau Cari Manual Lewat Kode</button>
      </div>

      <div class="card card-pad mt-16 hidden" id="hasil-scan">
        <h3 style="margin:0 0 12px;font-size:.9rem;">Hasil</h3>
        <table>
          <tr><td style="color:#94a3b8;width:100px;">Kode Aset</td><td id="r-kode"></td></tr>
          <tr><td style="color:#94a3b8;">Nama</td><td id="r-nama"></td></tr>
          <tr><td style="color:#94a3b8;">Kategori</td><td id="r-kategori"></td></tr>
          <tr><td style="color:#94a3b8;">Stok</td><td id="r-stok"></td></tr>
          <tr><td style="color:#94a3b8;">Satuan</td><td id="r-satuan"></td></tr>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    requireLogin();
    renderHeaderUser();
    terapkanBatasanRole();
    document.getElementById("logout-btn").addEventListener("click", logout);

    async function cariBarang(kode) {
      try {
        const b = await apiFetch(`/barang/scan/${encodeURIComponent(kode)}`);
        document.getElementById("r-kode").textContent = b.kode_aset;
        document.getElementById("r-nama").textContent = b.nama;
        document.getElementById("r-kategori").textContent = b.kategori;
        document.getElementById("r-stok").textContent = `${b.stok} ${b.satuan}`;
        document.getElementById("r-satuan").textContent = b.satuan;
        document.getElementById("hasil-scan").classList.remove("hidden");
        pinsToast("Barang ditemukan", "success");
      } catch (err) {
        pinsToast("Barang tidak ditemukan: " + err.message, "error");
      }
    }

    let scannerAktif = false;
    function mulaiScanner() {
      if (scannerAktif) return;
      scannerAktif = true;
      const html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        (decodedText) => {
          html5QrCode.stop();
          scannerAktif = false;
          try {
            const payload = JSON.parse(decodedText);
            cariBarang(payload.kode_aset || decodedText);
          } catch {
            cariBarang(decodedText);
          }
        },
        () => {}
      ).catch((err) => {
        scannerAktif = false;
        console.warn("Kamera tidak tersedia:", err);
      });
    }
    mulaiScanner();

    document.getElementById("btn-manual").addEventListener("click", () => {
      const kode = prompt("Masukkan kode aset barang:");
      if (kode) cariBarang(kode.trim());
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
